<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" aria-label="VIBSL">
  <!--
    Landing wordmark lockup. Velocity V mark (white + red on black) on the
    left, "VIBSL" wordmark on the right. Single source of truth means this
    matches the dashboard favicon at vibsl-ui-app-v1/app/icon.svg and the
    VibslIcon React component.
  -->
  <defs>
    <linearGradient id="vibsl-logo-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <svg x="4" y="4" width="40" height="40" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="#000000"/>
    <path d="M13,28 L31,28 L50,53 L69,28 L87,28 L50,90 Z" fill="#FFFFFF"/>
    <path d="M43,46 L50,34 L57,46" fill="none" stroke="url(#vibsl-logo-wing)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</svg>
